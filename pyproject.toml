[project]
name = "jev-desktop"
version = "0.1.0"
description = "LLM-agnostic low-latency execution runtime for desktop computer-use agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "httpx[http2]>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]
macos = [
  "pyobjc-framework-ApplicationServices>=11",
  "pyobjc-framework-Cocoa>=11",
  "pyobjc-framework-Quartz>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
